<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="content-label" content="虛構情境">
<title>groks｜先騙你一次</title>
<style>
  :root {
    --bg: #0a0b10;
    --ink: #e8eaf0;
    --mute: #8b90a0;
    --amber: #ffb84d;
    --edge: #2a3040;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  main {
    width: min(32rem, 100%);
    border: 1px solid var(--edge);
    border-radius: 16px;
    padding: 32px 28px;
  }
  p.kicker {
    margin: 0 0 8px;
    color: var(--amber);
    font-size: .8rem;
    letter-spacing: .12em;
  }
  h1 { margin: 0 0 12px; font-size: 1.6rem; letter-spacing: .04em; }
  p { margin: 0 0 12px; color: var(--mute); line-height: 1.6; }
  a.enter {
    display: inline-block;
    margin-top: 8px;
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--amber);
    color: #1a1204;
    font-weight: 700;
    text-decoration: none;
  }
  a.enter:hover, a.enter:focus { filter: brightness(1.08); }
</style>
</head>
<body>
<main>
  <p class="kicker">虛構情境</p>
  <h1>先騙你一次</h1>
  <p>夜間剪接室在下一頁。用手機開，請勿靜音。</p>
  <a class="enter" href="./gotcha/">進入夜間剪接室</a>
</main>
</body>
</html>
