<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="alivelog">
<meta name="theme-color" content="#120f1a"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>alivelog 頂樓房</title>
<style>
*{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;touch-action:none;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:#2a2a3c;overflow:hidden;user-select:none}
#back{position:fixed;left:0;right:0;top:0;background:#3a3e52;pointer-events:none}
.px{position:absolute;image-rendering:pixelated;background-repeat:no-repeat}
#sky{background-image:url(sky.png);background-size:100% 100%}
#planes{position:absolute;image-rendering:pixelated}
#fg{background-image:url(room_fg.png);background-size:100% 100%}
#win{position:absolute;cursor:grab;touch-action:none}
#win .px{top:0;height:100%;background-size:auto 100%}
#sheer{left:0;background-image:url(sheer.png)}
#dl{left:0;background-image:url(drape_l.png)}
#dr{right:0;background-image:url(drape_r.png);background-position:right top}
.ready #sheer{transition:width .9s steps(12)} .ready #dl,.ready #dr{transition:width .7s steps(10)}
#tv{position:absolute;background:#000}
#tv.big{z-index:5;box-shadow:0 0 0 100vmax rgba(10,8,16,.75)}
#tv iframe,#tv #yt{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#osd{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:2}
#hit{position:absolute;inset:0;z-index:3;cursor:pointer;touch-action:none}
#tv.pass #hit{pointer-events:none} #tv.pass{box-shadow:0 0 0 2px rgba(240,178,90,.35)} #tv.big.pass{box-shadow:0 0 0 2px rgba(240,178,90,.35),0 0 0 100vmax rgba(10,8,16,.75)}
#rc{position:absolute;z-index:9;display:none;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#24222c;border:3px solid #120f1a;box-shadow:4px 4px 0 #05070a,inset 0 2px 0 #3c3c44;padding:10px;display:none;grid-template-columns:repeat(3,56px);gap:8px;image-rendering:pixelated}
#rc b{display:flex;align-items:center;justify-content:center;height:40px;background:#3c3c44;color:#e0cbb8;font:bold 13px monospace;border:2px solid #120f1a;box-shadow:inset 0 -3px 0 #24222c;cursor:pointer;user-select:none}
#rc b:active{transform:translateY(2px);box-shadow:none}
#rc .jm{display:none} #rc.joe b.jm{display:flex} #rc.joe i.jm{display:block}
#rc b.pw{background:#c03a2c;color:#fff}
#chsel{position:absolute;left:4%;top:6%;z-index:4;display:none;background:#120f1a;border:2px solid #f0b25a;color:#f0b25a;font:bold 14px monospace;padding:6px 10px;cursor:pointer;box-shadow:3px 3px 0 #05070a}
#chsel small{display:block;color:#8a8494;font-size:10px;margin-top:3px}
#poweroff{position:absolute;inset:0;background:#05070a;z-index:2;pointer-events:none;opacity:1;transition:opacity .45s ease-out,background-color .25s}
#poweroff.bl{background:#16161c} #poweroff.hide{opacity:0} #tv.pass #poweroff{opacity:.35}
#poweroff i{position:absolute;left:0;right:0;top:50%;height:1px;background:#8a8a96;opacity:0}
#poweroff.on i{animation:lnOpen .6s steps(12) forwards} #poweroff.off i{animation:lnClose .35s steps(8) forwards}
@keyframes lnOpen{0%{opacity:0;transform:scaleX(.08)}35%{opacity:.7;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1) scaleY(24)}}
@keyframes lnClose{0%{opacity:1;transform:scaleY(30)}55%{opacity:1;transform:scaleY(1)}85%{opacity:1;transform:scaleX(.03) scaleY(1)}100%{opacity:0;transform:scaleX(0)}} #tv.pass iframe{pointer-events:auto}   /* 還沒播放時讓第一下直接點到 YouTube 播放器（iOS 必須） */
#mon{position:absolute;cursor:pointer;image-rendering:pixelated;background:#000}
#mon.big{z-index:6;box-shadow:0 0 0 100vmax rgba(10,8,16,.8)}
#remote{position:absolute;cursor:pointer;z-index:4}
</style></head><body>
<div id="back"></div><div id="sky" class="px"></div><canvas id="planes" width="600" height="420"></canvas><canvas id="wx" class="px" width="600" height="420"></canvas><div id="tint" class="px" style="pointer-events:none"></div><div id="fg" class="px"></div><canvas id="amb" class="px" width="600" height="420" style="pointer-events:none"></canvas>
<div id="win"><div id="sheer" class="px"></div><div id="dl" class="px"></div><div id="dr" class="px"></div></div>
<div id="tv"><div id="slot"><div id="yt"></div></div><div id="poweroff" class="bl" data-off="0"><i></i></div><div id="chsel"></div><canvas id="osd" width="106" height="60"></canvas><div id="hit"></div></div>
<div id="remote"></div>
<div id="rc"></div><canvas id="mon" width="38" height="24"></canvas>
<script>
// ---- 座標（底圖 600x420 樓中樓，Nook loft_final/coords.md）----
const SCREEN={x:102,y:196,w:106,h:60}, WIN={x:5,y:223,w:60,h:158}, REMOTE={x:197,y:341,w:9,h:13}, MON={x:276,y:287,w:38,h:24};
// 實測（10/12 headless）：民視、TVBS 的 live_stream?channel= 嵌入顯示「This video is unavailable」，
// 所以這兩台先用目前的 24h 直播影片 ID，播放器報錯才改用 live_stream；公視 live_stream 可以直接播。
const CH=[
 {name:'民視',src:'ylYJSBUgaMA',alt:'live_stream?channel=UC2VmWn8dAqkzlQqvy02E1PA'},
 {name:'TVBS',src:'m_dhMSvUCIc',alt:'live_stream?channel=UC5nwNW4KdC0SzrhF9BXEYOQ'},
 {name:'公視',src:'live_stream?channel=UCexpzYDEnfmAvPSfG4xbcjA'},
 {name:'Joeman',src:'videoseries?list=UUPRWWKG0VkBA0Pqa4Jr5j0Q'}];
const PARAMS='autoplay=1&mute=1&controls=0&disablekb=1&modestbranding=1&playsinline=1&rel=0&iv_load_policy=3&fs=0&enablejsapi=1&origin='+encodeURIComponent(location.origin);
const $=id=>document.getElementById(id);
let s=1,big=false,curtain=0,ch=0,player=null,apiReady=false,unlocked=false;
let vol=+(localStorage.getItem('alivelog.tv.volume')??40);
// ---- 版面：整張縮放（contain，不平移；接近整數倍才取整數裝置像素）----
const STAGE={w:600,h:420};let ox=0,oy=0;
function layout(){
  let W=innerWidth,H=innerHeight;
  if(navigator.standalone){const P=H>=W,a=Math.max(screen.width,screen.height),b=Math.min(screen.width,screen.height);if(P)H=Math.max(H,a);else W=Math.max(W,a),H=Math.max(H,b)}
  const dpr=devicePixelRatio||1;s=Math.min(W/STAGE.w,H/STAGE.h);const sd=Math.floor(s*dpr);if(sd>=1&&sd/dpr>=s*0.9)s=sd/dpr;
  const cw=Math.round(STAGE.w*s),ch=Math.round(STAGE.h*s);ox=Math.floor((W-cw)/2);oy=Math.floor((H-ch)/2);
  window.VIEW={s,ox,oy};$('back').style.height=(oy+Math.round(ch*0.55))+'px';
  const box=(el,r)=>Object.assign(el.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});
  const at=r=>({x:Math.round(ox+r.x*s),y:Math.round(oy+r.y*s),w:Math.round(r.w*s),h:Math.round(r.h*s)});
  for(const id of["sky","wx","fg","tint","planes","amb"].filter(i=>$(i)))box($(id),{x:ox,y:oy,w:cw,h:ch});
  box($('win'),at(WIN));box($('remote'),at(REMOTE));
  const pc=n=>(n/WIN.w*100)+'%';
  $('dl').style.width=$('dr').style.width=pc(curtain>=1?4:WIN.w/2);
  $('sheer').style.width=pc(curtain>=2?4:WIN.w);
  let r=at(SCREEN);
  if(big){const w=Math.min(innerWidth*.94,innerHeight*.9*16/9);r={x:(innerWidth-w)/2,y:(innerHeight-w*9/16)/2,w,h:w*9/16}}
  box($('tv'),r);
  const m=$('mon');if(zoomed==='mon'){const k=Math.max(1,Math.floor(Math.min(innerWidth*.92/256,innerHeight*.92/144)));box(m,{x:(innerWidth-256*k)/2|0,y:(innerHeight-144*k)/2|0,w:256*k,h:144*k})}else box(m,at(MON));
  dispatchEvent(new Event('alivelog:layout'));if(typeof spatial==='function'){clearTimeout(layout.sp);layout.sp=setTimeout(spatial,120)}
}
// ---- 電視：只建立一次 YT.Player，換台用 API（不重建 iframe）----
// 公視 live 影片 ID 於 10/12 由 /channel/.../live 解析；失效時改用 live_stream 嵌入
CH[2]={name:'公視',vid:'quwqlazU-c8',alt:'live_stream?channel=UCexpzYDEnfmAvPSfG4xbcjA'};
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);window.IOS=IOS;
CH[0].vid='ylYJSBUgaMA';CH[1].vid='m_dhMSvUCIc';CH[3].list='UULFPRWWKG0VkBA0Pqa4Jr5j0Q';   // 公開長片清單（備用）
// 10/12 從公開長片清單取的最新影片（拿掉會員限時公開那支，它在嵌入裡會卡住）
CH[3].ids=['qY4NdSN__Q0','OPI_9iQIEIA','lU_gjuCHFoQ','FO38gLrxRxo','WJqp--kvmhc','mZUewl7DbUE','it6Dp9QVn80','oXDuWJvZCQo','7qI8kmT2a0A','OqlHIUQVQmI'];
const PV={cc_load_policy:0,hl:'zh-TW',autoplay:1,mute:1,controls:0,disablekb:1,modestbranding:1,playsinline:1,rel:0,iv_load_policy:3,fs:0,enablejsapi:1,origin:location.origin};
let ready=false,altMode=false,watchT=null;window.TVLOG=[];
const log=(...a)=>{TVLOG.push(a.join(' '));if(TVLOG.length>200)TVLOG.shift()};
function noCC(){try{player.unloadModule('captions');player.unloadModule('cc');player.setOption('captions','track',{})}catch(e){}}
function load(){const c=CH[ch];if(!ready)return;playState.skipped=false;
  if(!unlocked)player.mute();else{player.unMute();player.setVolume(vol)}
  if(c.ids){player.loadPlaylist(c.ids,0);log('loadPlaylist ids')}else if(c.list){player.loadPlaylist({listType:'playlist',list:c.list,index:0});log('loadPlaylist',c.list)}
  else{player.loadVideoById(c.vid);log('loadVideoById',c.vid)}
  clearTimeout(watchT);watchT=setTimeout(watch,6000)}
// 換台後 3 秒還沒播：先確保播放（必要時靜音播），之後下一次碰觸再開聲音
// 換台 6 秒後還沒播：只補一次 playVideo（必要時靜音），不重新載入（每次重載都會多一次廣告、聲音也會斷）
function watch(){if(!ready)return;const st=player.getPlayerState();log('watch',ch,st);
  if(st!==1&&st!==3){if(!unlocked)player.mute();player.playVideo()}}
let needUnmute=false;
function useAlt(){altMode=true;log('alt',CH[ch].alt);$('slot').innerHTML='';const f=document.createElement('iframe');f.allow='autoplay; encrypted-media';
  f.src='https://www.youtube.com/embed/'+CH[ch].alt+'&autoplay=1&mute=1&controls=0&playsinline=1&rel=0&fs=0&iv_load_policy=3';$('slot').appendChild(f)}
function tune(i){if(altMode){altMode=false;$('slot').innerHTML='<div id="yt"></div>';ready=false;make()}
  ch=(i+CH.length)%CH.length;load();noise(300,()=>osdText('CH '+(ch+1),1500))}
// ---- 播放狀態：沒在播就開「穿透」讓下一下點到播放器，並在螢幕閃 TAP ----
let passT=null,hintT=null,iframeTap=false;
// 點進 YouTube iframe 時主頁面會失去焦點，用這個判斷「真的有人點了播放器」
addEventListener('blur',()=>{setTimeout(()=>{if(document.activeElement&&document.activeElement.tagName==='IFRAME'){iframeTap=true;log('iframe tap')}},0)});
function playState(st){clearTimeout(passT);if($('poweroff').dataset.off==='1')return;if(st===1){if(scrWait){scrWait=false;setTimeout(()=>{if($('poweroff').dataset.off!=='1')$('poweroff').classList.add('hide')},1400)}if($('tv').classList.contains('pass')&&!unlocked&&iframeTap){unlocked=true;log('unlock via iframe tap');if(vol>0)player.unMute()}$('tv').classList.remove('pass');clearInterval(hintT);hintT=null;g.clearRect(0,0,106,60);spatial();return}
  if(!unlocked&&!powered){return}   // 使用者還沒操作前不進穿透模式，避免攔走滑動手勢
  if(st===3){if(CH[ch].ids&&!playState.skipped)passT=setTimeout(()=>{if(player.getPlayerState()===3){playState.skipped=true;log('stall next');player.nextVideo()}},25000);return}
  passT=setTimeout(()=>{const s2=player.getPlayerState&&player.getPlayerState();if(s2===1||s2===3)return;
    $('tv').classList.add('pass');log('pass on',s2)},IOS?1200:2500)}
// ---- 空間音效：電視在畫面中的比例 × 離畫面中心的距離 ----
let spatialF=1,iosAway=false;window.SPATIAL=()=>({f:spatialF,iosAway});
function spatial(){const r=$('tv').getBoundingClientRect(),W=innerWidth,H=innerHeight;
  const vis=Math.max(0,Math.min(r.right,W)-Math.max(r.left,0))*Math.max(0,Math.min(r.bottom,H)-Math.max(r.top,0))/(r.width*r.height||1);
  const d=Math.hypot(r.left+r.width/2-W/2,r.top+r.height/2-H/2)/Math.hypot(W/2,H/2);
  spatialF=big?1:Math.max(0,Math.min(1,vis*(1-0.6*Math.min(1,d))));
  if(!ready||altMode||!unlocked)return;
  if(IOS)return;   // iOS 不能漸變音量，依冬瓜決定：平移時完全不動聲音
  else{const v=Math.round(vol*spatialF);if(Math.abs(v-(spatial.last??-99))>=3||v===0){spatial.last=v;player.setVolume(v)}}}   // 只有變化 ≥3 才送指令
function make(){const c=CH[ch];const opt={width:'100%',height:'100%',playerVars:Object.assign({},PV),events:{
  onReady:e=>{ready=true;log('ready');load()},
  onStateChange:e=>{log('state',e.data);if(e.data===1||e.data===-1)noCC();playState(e.data);if(e.data===5)setTimeout(()=>{if(player.getPlayerState()===5)player.playVideo()},300)},
  onError:e=>{log('error',e.data);if(CH[ch].alt&&!altMode)useAlt();else tune(ch+1)}}};
  player=new YT.Player('yt',opt)}
window.onYouTubeIframeAPIReady=()=>{apiReady=true;make()};
// ---- 螢幕 OSD：像素雜訊、台號、音量條 ----
const osd=$('osd'),g=osd.getContext('2d');let osdTimer;
const FONT={C:'111100100100111',H:'101101111101101',' ':'000000000000000',V:'101101101101010',O:'111101101101111',L:'100100100100111',M:'101111111101101',U:'101101101101111',E:'111100110100111',T:'111010010010010',A:'010101111101101',P:'111101111100100'};
for(let d=0;d<10;d++)FONT[d]=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'][d];
function text(t,x,y,c){g.fillStyle=c;[...t].forEach((k,i)=>{const b=FONT[k]||FONT[' '];for(let j=0;j<15;j++)if(b[j]=='1')g.fillRect(x+i*4+j%3,y+(j/3|0),1,1)})}
function noise(ms,done){clearTimeout(osdTimer);const t0=performance.now();(function f(){const im=g.createImageData(106,60);for(let i=0;i<im.data.length;i+=4){const v=Math.random()<.5?40:200;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0);if(performance.now()-t0<ms)requestAnimationFrame(f);else{g.clearRect(0,0,106,60);done&&done()}})()}
function osdText(t,ms){g.clearRect(0,0,106,60);g.fillStyle='#120f1a';g.fillRect(3,3,t.length*4+3,9);text(t,5,5,'#f0b25a');clearTimeout(osdTimer);osdTimer=setTimeout(()=>g.clearRect(0,0,106,60),ms)}
function osdVol(){g.clearRect(0,0,106,60);g.fillStyle='#120f1a';g.fillRect(3,48,62,9);text('VOL',5,50,'#e0cbb8');const n=Math.round(vol/10);for(let i=0;i<10;i++){g.fillStyle=i<n?'#f0b25a':'#3c3c44';g.fillRect(19+i*4,50,3,5)}clearTimeout(osdTimer);osdTimer=setTimeout(()=>g.clearRect(0,0,106,60),1200)}
function setVol(v){vol=Math.max(0,Math.min(100,Math.round(v)));localStorage.setItem('alivelog.tv.volume',vol);if(ready&&!altMode){if(vol>0){player.unMute();needUnmute=false}else player.mute();player.setVolume(Math.round(vol*spatialF));log('vol',vol)}osdVol()}
// ---- 手勢（觸控與滑鼠拖曳都走 pointer events）----
let st=null;
$('hit').addEventListener('pointerdown',e=>{if(ready&&!altMode&&player.getPlayerState()!==1){player.playVideo()}st={x:e.clientX,y:e.clientY,v:vol,moved:false};$('hit').setPointerCapture(e.pointerId)});
$('hit').addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
  if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){st.moved='v';setVol(st.v-dy/($('tv').clientHeight)*100)}});
$('hit').addEventListener('pointerup',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y,m=st.moved;st=null;
  if(m==='v')return;
  if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)){previewCh(dx<0?1:-1);return}
  if(Math.abs(dx)<6&&Math.abs(dy)<6&&!big){zoom('tv')}});
// ---- 遙控器（主要操作）：點沙發上的遙控器開面板，點外面關 ----
// ---- 選台：CH+/CH-／左右滑只移動選台框（不載入影片），按 OK 或點選台框才真的換台；4 秒沒動作或點外面取消 ----
let pre=null,preT=null;
function previewCh(d){pre=((pre??ch)+d+CH.length)%CH.length;const el=$('chsel');
  el.innerHTML='CH '+(pre+1)+' '+CH[pre].name+'<small>'+(pre===ch?'目前頻道':'按 OK 或點這裡切換')+'</small>';el.style.display='block';
  clearTimeout(preT);preT=setTimeout(cancelCh,4000);log('preview',pre)}
function cancelCh(){pre=null;clearTimeout(preT);$('chsel').style.display='none'}
// Joeman 台：上一支／下一支（在 10 支公開影片之間循環），顯示 4-n/10
function joe(d){if(ch!==3||!ready)return;const n=CH[3].ids.length,i=((player.getPlaylistIndex()??0)+d+n)%n;player.playVideoAt(i);noCC();
  const el=$('chsel');el.innerHTML='4-'+(i+1)+'/'+n+'<small>Joeman</small>';el.style.display='block';clearTimeout(preT);preT=setTimeout(()=>{if(pre===null)el.style.display='none'},2000);log('joe',i)}
function rcJoe(){$('rc').classList.toggle('joe',ch===3)}
setInterval(rcJoe,500);
function confirmCh(){if(pre===null)return;const t=pre;cancelCh();if(t!==ch)tune(t)}
$('chsel').addEventListener('pointerdown',e=>{e.stopPropagation();confirmCh()});
document.addEventListener('pointerdown',e=>{if(pre!==null&&!$('rc').contains(e.target)&&!$('tv').contains(e.target)&&e.target!==$('remote'))cancelCh()},true);
// ---- 開關機畫面：黑 → 背光暗灰 → 中央亮線展開 → 等到真的在播才淡出（蓋住 YouTube 縮圖/紅色播放鍵/標題）----
let scrWait=true;
function screenOn(){const o=$('poweroff');o.dataset.off='0';o.className='bl';void o.offsetWidth;o.classList.add('on');scrWait=true;
  setTimeout(()=>{if(scrWait&&ready&&player.getPlayerState()===1){scrWait=false;setTimeout(()=>{if(o.dataset.off!=='1')o.classList.add('hide')},1400)}},650)}
function screenOff(){const o=$('poweroff');o.dataset.off='1';scrWait=false;o.className='';void o.offsetWidth;o.classList.add('off')}
let powered=false,userMuted=false;   // 一進門電視是「靜音待機播放」；第一次按電源＝開聲音播放，之後才是開/關
$('remote').addEventListener('pointerup',e=>{e.stopPropagation();$('rc').style.display=$('rc').style.display==='grid'?'none':'grid'});
document.addEventListener('pointerdown',e=>{if($('rc').style.display==='grid'&&!$('rc').contains(e.target)&&e.target!==$('remote'))$('rc').style.display='none'},true);
function power(){ // 必須在按下的當下同步呼叫，iOS 才算使用者手勢
  if(!ready)return;const st=player.getPlayerState();
  if(powered){player.pauseVideo();clearTimeout(passT);$('tv').classList.remove('pass');powered=false;screenOff();log('power off');return}
  powered=true;screenOn();unlocked=true;if(!userMuted&&vol>0)player.unMute();player.setVolume(Math.round(vol*spatialF));player.playVideo();log('power on');audio();
  // iOS 若仍不播：放大電視並讓下一下直接點到 YouTube 播放器（只有淡淡的框，不閃字）
  setTimeout(()=>{const s2=player.getPlayerState();if(s2!==1&&s2!==3){$('rc').style.display='none';zoom('tv');$('tv').classList.add('pass');log('power needs iframe tap',s2)}},1500)}
window.rcKey=k=>{if(!k)return;unlock();
  if(k==='pw')power();else if(k==='chu')previewCh(1);else if(k==='chd')previewCh(-1);else if(k==='ok')confirmCh();else if(k==='nxt')joe(1);else if(k==='prv')joe(-1);

  else if(k==='vu'){userMuted=false;setVol(vol+10)}else if(k==='vd')setVol(vol-10);
  else if(k==='mu'){userMuted=!userMuted;if(ready){userMuted?player.mute():player.unMute()}osdText(userMuted?'MUTE':'VOL',900)}};

  if(unlocked)return;unlocked=true;if(ready&&!altMode){player.unMute();player.setVolume(Math.round(vol*spatialF));player.playVideo();spatial();log('unlock')}audio()}

function setCurtain(c){$('win').classList.add('ready');clearTimeout(setCurtain.t);setCurtain.t=setTimeout(()=>$('win').classList.remove('ready'),1000);curtain=Math.max(0,Math.min(2,c));layout()}

// ---- 小飛機（只畫在天空層，被建築和房間蓋住）----
const pg=$('planes').getContext('2d');
const LIVERY=[{body:'#2e4a3a',tail:'#d0703a',stripe:'#d0703a'},   // 墨綠＋橘
              {body:'#2a2a3c',tail:'#c8a050',stripe:'#c8a050'},   // 深色＋金
              {body:'#c890c0',tail:'#8a5aa8',stripe:'#e0cbb8'}];  // 粉紫
let plane=null;
function spawn(){const dir=Math.random()<.5?1:-1;plane={x:dir>0?-20:620,y:20+Math.random()*150|0,dir,v:(14+Math.random()*8),c:LIVERY[Math.random()*3|0],t0:performance.now()};engine(600/plane.v)}
function drawPlane(p){const x=Math.round(p.x),y=p.y,d=p.dir,R=(dx,dy,w,h,c)=>{pg.fillStyle=c;pg.fillRect(d>0?x+dx:x-dx-w+1,y+dy,w,h)};
  R(0,0,14,2,p.c.body);R(0,1,14,1,'#24222c');R(12,0,2,1,'#e0cbb8');R(-1,-3,3,3,p.c.tail);R(5,2,4,1,p.c.body);R(4,-1,4,1,p.c.body);R(2,0,8,1,p.c.stripe)}
let last=performance.now();
function tick(now){const dt=(now-last)/1000;last=now;pg.clearRect(0,0,600,420);
  if(plane){plane.x+=plane.dir*plane.v*dt;drawPlane(plane);if(plane.x<-30||plane.x>630){plane=null;schedule()}}
  requestAnimationFrame(tick)}
function schedule(){setTimeout(spawn,(40+Math.random()*80)*1000)}
// ---- 引擎聲：Web Audio 合成低頻噪音，淡入淡出，很小聲 ----
let ac=null;function audio(){if(window.IOS)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function engine(sec){if(!ac||!unlocked||IOS)return;   // iOS 開 Web Audio 會搶音訊、讓電視聲音頓一下，所以 iOS 不放引擎聲
const n=ac.createBufferSource(),len=ac.sampleRate*2,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
  let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
  n.buffer=b;n.loop=true;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=140;const gn=ac.createGain(),t=ac.currentTime;
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.025,t+sec*.45);gn.gain.linearRampToValueAtTime(0,t+sec);
  n.connect(lp).connect(gn).connect(ac.destination);n.start(t);n.stop(t+sec+.1)}
