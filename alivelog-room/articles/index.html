<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<title>文章集｜冬瓜的小窩</title>
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#2a2a24;--ink2:#45443d;--muted:#7a766b;--line:#e8e2d6;--main:#2f5d50;--main-soft:#eaf1ed;--warm:#c58a42;--warm-soft:#faf1e4;--r:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;letter-spacing:.01em}
a{color:var(--main);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 48px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
header.top{padding:22px 0 8px}
header.top h1{margin:0;font-size:1.15rem;letter-spacing:.12em;font-weight:600;color:var(--main)}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-decoration:none;color:inherit;min-height:48px}
.card:hover{border-color:#d3c7b2}
.card time{display:block;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card .title{display:block;margin-top:4px;font-size:1.05rem;font-weight:600;line-height:1.5;color:var(--ink)}
.kicker{margin:0 0 8px;font-size:.88rem}
.kicker a{text-decoration:none}
.dochead h1{margin:0 0 8px;font-size:1.45rem;line-height:1.45;font-weight:600;color:var(--ink)}
.docmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0 0 18px;color:var(--muted);font-size:.92rem}
.docmeta time{font-variant-numeric:tabular-nums}
.pdf{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;font-weight:600}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 8px;margin:0 0 16px}
h2{margin:0 0 12px;font-size:1.18rem;line-height:1.5;font-weight:600;color:var(--ink)}
h3{margin:22px 0 8px;font-size:1.02rem;line-height:1.5;font-weight:600;color:var(--main)}
p{margin:0 0 14px}
p.speaker{color:var(--ink2);margin-top:-4px}
p.key{background:var(--main-soft);border-radius:14px;padding:14px 16px;color:var(--main);line-height:1.85}
ul,ol{margin:4px 0 16px;padding-left:1.35em}
li{margin:0 0 8px;padding-left:.15em}
li::marker{color:var(--main)}
strong{font-weight:600}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 16px}
table{border-collapse:collapse;width:100%;min-width:36em;background:#fff;font-size:.95rem;line-height:1.7}
th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
th:nth-child(1),td:nth-child(1){width:9.5em}
th:nth-child(3),td:nth-child(3){width:6.5em;white-space:nowrap}
thead th{color:var(--muted);font-weight:600;font-size:.85rem;background:#f6f1e8;white-space:nowrap}
tbody td:first-child{font-weight:600;color:var(--main)}
.back{margin:8px 0 0}
@media (max-width:640px){
  .dochead h1{font-size:1.28rem}
  section{padding:16px 14px 4px}
  .tbl{overflow:visible}
  table{min-width:0;font-size:1rem}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table,tbody,tr,td{display:block;width:auto;white-space:normal}
  tr{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden}
  td{border-bottom:0;border-top:1px solid var(--line)}
  tr td:first-child{border-top:0}
  td::before{content:attr(data-h);display:block;font-size:.78rem;line-height:1.4;font-weight:600;color:var(--muted);margin-bottom:2px}
}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><h1>文章集</h1></header>
<main>
<a class="card" href="2026-11-12.html">
<time datetime="2026-11-12">2026-11-12</time>
<span class="title">資料治理年會－技術場講座重點筆記</span>
</a>
</main>
</div>
</body>
</html>
